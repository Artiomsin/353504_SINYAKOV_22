{% extends "core/base.html" %}

{% block content %}
<div class="vacancy-container">
    <h2>Вакансии</h2>

    {% for vacancy in vacancies %}
    <div class="vacancy-block">
        <div class="vacancy-card">
            <h3>{{ vacancy.title }}</h3>
            <p>{{ vacancy.description|linebreaks }}</p>
            <div class="vacancy-footer">
                <small>Опубликовано: {{ vacancy.date_posted|date:"d.m.Y" }}</small>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="vacancy-empty">
        <p>Нет активных вакансий</p>
    </div>
    {% endfor %}
    <div class="clear"></div>
</div>
{% endblock %}
