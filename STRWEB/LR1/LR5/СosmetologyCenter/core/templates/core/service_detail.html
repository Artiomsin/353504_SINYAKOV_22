{% extends "core/base.html" %}

{% block content %}
<div class="container my-5">
    <h2 class="mb-4 text-center text-primary fw-bold">{{ service.name }}</h2>
    <div class="row g-4">
        <!-- Описание услуги -->
        <div class="col-md-8">
            <div class="card shadow-sm rounded-3 border-0">
                <div class="card-body">
                    <h5 class="card-title mb-3">Описание услуги</h5>
                    <p class="card-text text-secondary">{{ service.full_description }}</p>
                    <p class="h4 fw-semibold mt-4 text-success">{{ service.price }} руб.</p>
                </div>
            </div>
        </div>

        <!-- Форма записи -->
        <div class="col-md-4">
            <div class="card shadow-sm rounded-3 border-0">
                <div class="card-body">
                    <h5 class="card-title mb-4 text-center">Записаться</h5>
                    <form method="post" action="{% url 'add-to-cart' service.id %}">
    {% csrf_token %}
    <div class="mb-3">
        <label for="doctor" class="form-label">Выберите врача</label>
        <select id="doctor" name="doctor" class="form-select" required>
            <option value="" disabled selected>-- выберите врача --</option>
            {% for doctor in service.doctors.all %}
            <option value="{{ doctor.pk }}">{{ doctor.full_name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-4">
        <label for="date_time" class="form-label">Дата и время</label>
        <input id="date_time" type="datetime-local" name="date_time" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-outline-success w-100 fw-semibold">
        <i class="bi bi-cart-plus me-1"></i> Добавить в корзину
    </button>
</form>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
